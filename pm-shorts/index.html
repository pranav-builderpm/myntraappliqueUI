<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4a3fc4">
  <meta name="description" content="Learn product management in 60-word shorts, with links to the original articles, podcasts and replays.">
  <title>PM Shorts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div id="app-main" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <header class="top">
        <span class="brand"><b>PM</b>Shorts</span>
        <span class="grow"></span>
        <span id="pos" class="small muted" aria-live="polite"></span>
        <span class="pill" title="Today's goal"><svg class="ring" viewBox="0 0 26 26" aria-hidden="true"><circle class="bg" cx="13" cy="13" r="11"/><circle id="ringfg" class="fg" cx="13" cy="13" r="11"/></svg><span id="goaltxt">0/5</span></span>
        <span class="pill" title="Streak">🔥 <span id="streaktxt">0</span></span>
      </header>
      <div id="filterbar" class="filterbar" hidden></div>
      <main>
        <section id="v-feed" class="view feedview"><div id="feed" class="feed" tabindex="0" aria-label="PM shorts feed"></div></section>
        <section id="v-discover" class="view" hidden></section>
        <section id="v-saved" class="view" hidden></section>
        <section id="v-ritual" class="view" hidden></section>
        <section id="v-you" class="view" hidden></section>
      </main>
      <nav aria-label="Primary">
        <button data-go="feed" aria-current="page"><span>📰</span>Feed</button>
        <button data-go="discover"><span>🔎</span>Discover</button>
        <button data-go="saved"><span>🔖</span>Saved</button>
        <button data-go="ritual"><span>🔥</span>Ritual</button>
        <button data-go="you"><span>👤</span>You</button>
      </nav>
    </div>
    <div id="onb" class="onb" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="cards.js"></script>
  <script src="app.js"></script>
</body>
</html>
